# Driver Insight Agent Configuration

# External API Configuration
api:
  base_url: "https://external.driver.api"
  timeout: 30
  max_retries: 3
  retry_delay: 1

# Pagination Configuration
pagination:
  page_size: 100
  max_pages: 50

# Cache Configuration
cache:
  enabled: true
  ttl: 600  # seconds
  type: "memory"  # Options: memory, redis
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: null

# MCP Tool Server Configuration
mcp_tool_server:
  url: "http://localhost:8081/mcp-tools"
  timeout: 10
  enabled: true

# Validation Configuration
validation:
  required_fields:
    - driver_id
    - name
  strict_mode: false

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # json or text
  output: "stdout"  # stdout or file path

# Service Configuration
service:
  name: "driver-insight-agent"
  version: "1.0.0"
  port: 8080
  host: "0.0.0.0"
